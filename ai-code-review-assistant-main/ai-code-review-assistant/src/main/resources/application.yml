spring:
  application:
    name: ai-code-review-assistant

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  graphql:
    graphiql:
      enabled: true

  ai:
    openai:
      api-key: ${GROK_API_KEY:dummy-api-key}
      base-url: https://api.xai.com/v1
      chat:
        options:
          model: grok-beta
          temperature: 0.2
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3
          temperature: 0.2
